<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0a08">
  <title>Đăng nhập phòng chơi</title>
  <link rel="stylesheet" href="./login.css?v=13.4">
</head>
<body>
  <main class="login-screen">
    <div class="title-area" aria-hidden="true">
      <img src="./assets/title.png" alt="">
    </div>

    <section class="login-card" aria-label="Đăng nhập phòng chơi">
      <form id="playerForm" autocomplete="on">
        <label for="teamAccount">Tài khoản</label>
        <input id="teamAccount" name="username" autocomplete="username" required>

        <label for="teamPassword">Mật khẩu</label>
        <input id="teamPassword" name="password" type="password" autocomplete="current-password" required>

        <label for="playerName">Tên người chơi</label>
        <input id="playerName" name="playerName" autocomplete="name" required>

        <button class="primary" type="submit">Vào phòng chơi</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="./client-config.js?v=13.4.2"></script>
<script src="./login.js?v=13.4"></script>
</body>
</html>
